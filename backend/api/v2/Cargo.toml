[package]
name = "cardessy"
version = "0.1.0"
edition = "2021"
description = "Cardessy API — Riftbound, FaB (Rathe), and Magic (Magisterium) into one SQLite backend"
license = "MIT"
readme = "README.md"
keywords = ["cardessy", "riftbound", "riftdecks", "tcg", "mtg", "fab"]
categories = ["web-programming", "database"]

[[bin]]
name = "cardessy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
